storage:
  # 存储模式: 'local' (开发/测试) 或 'cloud' (生产)
  # 可以通过环境变量 STORAGE_MODE 覆盖
  mode: ${STORAGE_MODE:-local}
  
  local:
    # 基础路径，相对于 backend 目录
    # 建议指向 git 仓库外的目录或被 gitignore 的目录
    base_path: ${LOCAL_STORAGE_PATH:-../RG_data}
    
    # 子目录配置
    directories:
      videos: 'videos'
      audio: 'audio'
      images: 'images'
      cache: 'cache'
      
    # 清理策略
    cleanup:
      enabled: true
      max_age_days: 7
      max_size_mb: 1024  # 1GB
      
  cloud:
    # 生产环境云存储配置 (预留)
    provider: 'aliyun-oss'
    bucket: ${OSS_BUCKET:-rg-videos}
    region: ${OSS_REGION:-oss-cn-hangzhou}
    access_key: ${OSS_ACCESS_KEY}
    secret_key: ${OSS_SECRET_KEY}
    cdn_domain: ${CDN_DOMAIN}
